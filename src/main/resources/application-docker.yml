# Profile used by docker-compose (SPRING_PROFILES_ACTIVE=docker).
# Every value comes from an environment variable (.env), so no secret is stored in the repository.
server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/${DB_NAME:enso}}
    username: ${DB_USERNAME:enso}
    password: ${DB_PASSWORD:enso}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.enso: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET}                      # at least 32 characters
    expiration: ${JWT_EXPIRATION_MS:86400000}  # milliseconds, default 24 hours

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket-name: ${MINIO_BUCKET:enso-products}

kavenegar:
  api-key: ${KAVENEGAR_API_KEY}
  otp-template: ${KAVENEGAR_OTP_TEMPLATE}

zarinpal:
  merchant-id: ${ZARINPAL_MERCHANT_ID}
  request-url: ${ZARINPAL_REQUEST_URL}
  verify-url: ${ZARINPAL_VERIFY_URL}
  payment-url: ${ZARINPAL_PAYMENT_URL}
  callback-url: ${ZARINPAL_CALLBACK_URL}

enso:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  truststore:
    path: ${TRUSTSTORE_PATH}
    password: ${TRUSTSTORE_PASSWORD}